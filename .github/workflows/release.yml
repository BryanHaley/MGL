# Builds the MooGL SDK with tools/make_sdk.sh and publishes it as a GitHub
# release when a version tag such as v0.1.0 or v1.2.3-beta is pushed. The tag,
# without its "v", becomes the SDK's version. Run it by hand from the Actions
# tab for a dry run: the SDK is built as 0.1.0 and kept with the run, and
# nothing is published.
#
# Signing and notarizing use these repository secrets; without them the SDK
# is built unsigned:
#   MACOS_CERTIFICATE           the Developer ID Application certificate and key, as a base64 .p12
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   NOTARY_KEY                  an App Store Connect API key, as a base64 .p8
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID
name: Release SDK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdk:
    runs-on: macos-26
    steps:
      # the checkout's own git init asks for this
      - name: Set git's default branch name
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing certificate; the SDK will be unsigned"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: .*"' | head -1 | tr -d '"')"
          echo "MOOGL_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "MOOGL_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
            echo "MOOGL_NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
            echo "MOOGL_NOTARY_ISSUER=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
          fi

      - name: Build the SDK
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tools/make_sdk.sh "$GITHUB_REF_NAME"
          else
            tools/make_sdk.sh
          fi

      - name: Keep the SDK with the run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: MooGL-SDK
          path: dist/*.tar.gz

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "MooGL $GITHUB_REF_NAME" --generate-notes $prerelease
